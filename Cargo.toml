[workspace]
resolver = "3"
members = ["crates/nopass-core", "crates/nopass-helper", "crates/nopass"]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
license      = "MIT"

[workspace.dependencies]
nopass-core        = { path = "crates/nopass-core" }
serde              = { version = "1.0",  features = ["derive"] }
serde_json         = "1.0"
thiserror          = "2.0"
clap               = { version = "4.5",  features = ["derive"] }
nix                = { version = "0.30", default-features = false, features = ["fs", "user", "dir"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  default-features = false, features = ["registry", "std", "fmt"] }
tracing-journald   = "0.3"
tempfile           = "3"
# Tray-only (crates/nopass). See design.md §1 — one async-io reactor,
# no tokio anywhere in the tree (the single-reactor gate:
# scripts/assert-single-reactor.sh).
ksni               = { version = "=0.3.6", default-features = false, features = ["async-io"] }
zbus               = "5"     # own defaults = async-io; never default-features = false
notify-rust        = "~4.17" # 4.18 requires rustc 1.89; the workspace pins 1.85 (design.md G2/D2)
notify             = { version = "8", default-features = false }
async-io           = "2"
async-channel      = "2"
futures-lite       = "2"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
panic         = "unwind"   # deliberate: keeps panic exit 101 distinct from SIGABRT/134
