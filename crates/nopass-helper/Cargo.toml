[package]
name = "nopass-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nopass-core = { workspace = true }
clap = { workspace = true }
nix = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Integration tests (`tests/*.rs`) are a separate crate and do not
# automatically inherit `[dependencies]` — `nix` is re-listed here so
# `tests/fileops_tempdir.rs` can call `nix::sys::stat::umask` for its
# isolated umask-defeat scenario. Same version, no new features.
nix = { workspace = true }
