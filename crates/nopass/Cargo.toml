[package]
name = "nopass"
version = "0.1.0"
description = "Grants and revokes passwordless sudo for the current session's user through polkit."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nopass-core = { workspace = true }
nix = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ksni = { workspace = true }
zbus = { workspace = true }
notify-rust = { workspace = true }
notify = { workspace = true }
async-io = { workspace = true }
async-channel = { workspace = true }
futures-lite = { workspace = true }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = { workspace = true }

# Debian packaging. This is M4 scope pulled forward so the Lane C manual
# checklist can be installed with one command instead of eight sudo lines.
# M4 still owns the rest of that milestone: rpm, the AUR package, purge
# behaviour and testing on the target distributions.
[package.metadata.deb]
name = "nopass"
maintainer = "Jorge Alonso <j.alonso@enfoquestic.com>"
copyright = "2026, Jorge Alonso"
license-file = ["../../LICENSE", "0"]
extended-description = """
Grants and revokes passwordless sudo for the current session's user, for a
bounded time, through a privileged helper invoked via polkit. The tray never
writes to /etc/sudoers.d itself: every mutation goes through the helper, which
validates each rule with visudo before it is renamed into place and schedules a
transient systemd timer to revoke it."""
section = "admin"
priority = "optional"
depends = "$auto, sudo, policykit-1 | polkit"
assets = [
    # The tray: the only unprivileged binary, on the user's PATH.
    ["../../target/release/nopass", "usr/bin/", "755"],
    # The helper: invoked only through pkexec, never directly by the user,
    # which is why it lives in libexec rather than bin. Every distribution
    # ships it here. pkexec compares the resolved path of the program it
    # runs against the policy's exec.path annotation, and that path also
    # exists in nopass-core's HELPER_PATH constant, in nopass-cleanup.service
    # and in debian/prerm — so moving it for one package means moving it in
    # all four places or shipping an authorization failure. One path for
    # deb, rpm and AUR alike is what keeps them in agreement.
    ["../../target/release/nopass-helper", "usr/libexec/", "755"],
    # The privilege boundary's declaration. polkit reads this directory.
    ["../../data/com.enfoquestic.nopass.policy", "usr/share/polkit-1/actions/", "644"],
    # Creates /run/nopass at boot so the helper never has to.
    ["../../data/nopass.tmpfiles.conf", "usr/lib/tmpfiles.d/nopass.conf", "644"],
    # Sweeps stale and reboot-marked rules before anyone can log in.
    ["../../data/nopass-cleanup.service", "usr/lib/systemd/system/", "644"],
    ["../../data/icons/*.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # Without this the package installs a graphical application with no way
    # to launch it from a menu. StartupNotify is false because a tray item
    # never maps a window, so a launcher waiting for one would spin.
    ["../../data/nopass.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/nopass/README.md", "644"],
]
# Autostart is the user's decision, not the package's (RF-09), so no
# systemd-enable and no autostart entry are shipped here.
maintainer-scripts = "debian/"

# RPM packaging uses the same installed paths and permissions as the Debian
# package. Keep the helper at the compiled/polkit-annotated path: pkexec
# compares the resolved program path against that annotation.
[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/nopass", dest = "/usr/bin/nopass", mode = "755" },
    { source = "../../target/release/nopass-helper", dest = "/usr/libexec/nopass-helper", mode = "755" },
    { source = "../../data/com.enfoquestic.nopass.policy", dest = "/usr/share/polkit-1/actions/com.enfoquestic.nopass.policy", mode = "644" },
    { source = "../../data/nopass.tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/nopass.conf", mode = "644" },
    { source = "../../data/nopass-cleanup.service", dest = "/usr/lib/systemd/system/nopass-cleanup.service", mode = "644" },
    { source = "../../data/icons/*.svg", dest = "/usr/share/icons/hicolor/scalable/apps/", mode = "644" },
    { source = "../../data/nopass.desktop", dest = "/usr/share/applications/nopass.desktop", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/nopass/README.md", mode = "644" },
]
post_install_script = "rpm/postinst"
pre_uninstall_script = "rpm/prerm"
post_uninstall_script = "rpm/postrm"

[package.metadata.generate-rpm.requires]
sudo = "*"
polkit = "*"
systemd = "*"
