<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal session bus for the lane B tests.

  A plain `dbus-run-session` still reads the host's
  /usr/share/dbus-1/services, so the real desktop notification daemon is
  D-Bus activated inside the nested session and claims
  org.freedesktop.Notifications before our fake can. Four lane B tests
  depend on owning that name, or on nobody owning it, and they fail on any
  machine with a desktop installed.

  Omitting <standard_session_servicedirs/> gives a bus with no activatable
  services at all, which is what those tests actually need.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
